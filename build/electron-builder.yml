appId: com.bolt.upsc
productName: BOLT
copyright: "BOLT"

# Keep build output separate from tracked source.
directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: BOLT-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BOLT
